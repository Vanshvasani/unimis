worker_processes auto;
events { worker_connections 4096; }
http {
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Only login POSTs are limited. Campus NAT shares IPs, so keep this generous and tune it.
  map $request_method $login_key { POST $binary_remote_addr; default ""; }
  limit_req_zone $login_key zone=login:10m rate=30r/m;

  upstream app { server app:3000; keepalive 64; }

  server {
    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /_next/static/ {
      proxy_pass http://app;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /login {
      limit_req zone=login burst=30 nodelay;
      proxy_pass http://app;
    }
    location / { proxy_pass http://app; }
  }
}
