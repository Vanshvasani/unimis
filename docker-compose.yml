services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: unimis
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "work_mem=8MB"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]   # local only, for migrations

  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: unimis
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "40"
    depends_on: [db]

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@pgbouncer:5432/unimis?pgbouncer=true&connection_limit=10
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: "false"   # plain-HTTP local test only. Remove once TLS is in front.
    depends_on: [pgbouncer]
    deploy: { replicas: 3 }

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [app]

volumes: { pgdata: {} }
